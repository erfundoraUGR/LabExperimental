dataset: "dataset/combined_data_2009_2019.csv"
model: "ELMAN"
n_trials: 50
n_seeds: 3
sampler: "TPE"
use_pruner: true

parameters:
  WINDOW_SIZE:
    type: "categorical"
    values: [72, 96, 144, 288]

  BATCH_SIZE:
    type: "categorical"
    values: [16, 32, 64, 128]

  LR:
    type: "float"
    min: 1e-4
    max: 3e-3
    log: true

  EARLY_STOPPING_PATIENCE:
    type: "categorical"
    values: [5, 10]

  EARLY_STOPPING_MIN_DELTA:
    type: "float"
    min: 1e-6
    max: 1e-4
    log: true

  ELMAN_NUM_LAYERS:
    type: "int"
    min: 1
    max: 3

  ELMAN_HIDDEN_SIZES:
    type: "categorical_multi"
    values: [32, 64, 128, 256]
    num_layers_ref: "ELMAN_NUM_LAYERS"

  ELMAN_DROPOUT:
    type: "float"
    min: 0.0
    max: 0.3

  ELMAN_NONLINEARITY:
    type: "categorical"
    values: ["tanh", "relu"]
