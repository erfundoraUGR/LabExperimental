dataset: "dataset/combined_data_2009_2019.csv"
model: "GRU"
n_trials: 50
n_seeds: 3
sampler: "TPE"
use_pruner: true

parameters:
  WINDOW_SIZE:
    type: "categorical"
    values: [144, 288]

  BATCH_SIZE:
    type: "categorical"
    values: [16, 32, 64]

  LR:
    type: "float"
    min: 1e-4
    max: 3e-3
    log: true

  EARLY_STOPPING_PATIENCE:
    type: "categorical"
    values: [5, 10]

  EARLY_STOPPING_MIN_DELTA:
    type: "float"
    min: 1e-6
    max: 1e-4
    log: true

  GRU_NUM_LAYERS:
    type: "int"
    min: 1
    max: 3

  GRU_HIDDEN_SIZES:
    type: "int_multi"
    min: 1
    max: 100
    num_layers_ref: "GRU_NUM_LAYERS"

  GRU_DROPOUT:
    type: "float"
    min: 0.0
    max: 0.3
