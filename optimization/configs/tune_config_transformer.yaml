dataset: "dataset/combined_data_2009_2019.csv"
model: "TRANSFORMER"
n_trials: 50
n_seeds: 3
sampler: "TPE"
use_pruner: true

# TRANSFORMER_D_MODEL  → d_model / embedding dimension (emb in TFM)
# TRANSFORMER_FC_HIDDEN_SIZES → FC layers after encoder (hidden_layers in TFM)
# build_model() assembles TRANSFORMER_HIDDEN_SIZES = [d_model, *fc_layers]
# d_model is auto-adjusted upward to be divisible by TRANSFORMER_NUM_HEADS
parameters:
  WINDOW_SIZE:
    type: "categorical"
    values: [144, 288]

  BATCH_SIZE:
    type: "categorical"
    values: [16, 32, 64]

  LR:
    type: "float"
    min: 1e-4
    max: 3e-3
    log: true

  EARLY_STOPPING_PATIENCE:
    type: "categorical"
    values: [5, 10]

  EARLY_STOPPING_MIN_DELTA:
    type: "float"
    min: 1e-6
    max: 1e-4
    log: true

  TRANSFORMER_NUM_HEADS:
    type: "categorical"
    values: [2, 4, 8]

  TRANSFORMER_D_MODEL:
    type: "int"
    min: 4
    max: 100

  TRANSFORMER_NUM_LAYERS:
    type: "int"
    min: 1
    max: 4

  TRANSFORMER_FC_NUM_LAYERS:
    type: "int"
    min: 0
    max: 3

  TRANSFORMER_FC_HIDDEN_SIZES:
    type: "int_multi"
    min: 1
    max: 100
    num_layers_ref: "TRANSFORMER_FC_NUM_LAYERS"

  TRANSFORMER_DROPOUT:
    type: "float"
    min: 0.0
    max: 0.3
